<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Fichero — Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDEBE3;
    --paper-2:#E3E0D4;
    --card:#FBF9F4;
    --card-back:#F3EFE3;
    --ink:#232622;
    --ink-soft:#5B5A52;
    --accent:#2F6F5E;
    --accent-ink:#F4F6F1;
    --accent-2:#8A4B3B;
    --accent-2-ink:#F7EFEA;
    --danger:#A23E3E;
    --tab-inactive:#C9C2AF;
    --line:#D6D2C2;
    --radius:14px;
    --shadow:0 1px 0 rgba(35,38,34,0.04), 0 8px 20px -12px rgba(35,38,34,0.35);
    --mono:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    --sans:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }

  button{ font-family:inherit; cursor:pointer; }
  textarea{ font-family:inherit; }

  :focus-visible{
    outline:2px solid var(--accent-2);
    outline-offset:2px;
    border-radius:4px;
  }

  /* ---------- Header ---------- */
  header{
    padding:22px 20px 14px;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:14px;
    flex-wrap:wrap;
  }
  .brand{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .brand .kicker{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .brand h1{
    margin:0;
    font-family:var(--mono);
    font-weight:700;
    font-size:22px;
    letter-spacing:-0.01em;
  }
  #examToggle{
    font-family:var(--mono);
    font-weight:600;
    font-size:13px;
    letter-spacing:.02em;
    background:var(--accent-2);
    color:var(--accent-2-ink);
    border:none;
    border-radius:999px;
    padding:11px 18px;
    display:inline-flex;
    align-items:center;
    gap:8px;
    box-shadow:var(--shadow);
    transition:transform .15s ease;
  }
  #examToggle:hover{ transform:translateY(-1px); }
  #examToggle:active{ transform:translateY(0); }
  #examToggle .count{
    background:rgba(0,0,0,0.18);
    border-radius:999px;
    padding:1px 8px;
    font-size:12px;
  }

  /* ---------- Day tabs (fichero dividers) ---------- */
  #tabsBar{
    display:flex;
    align-items:flex-end;
    gap:6px;
    padding:0 16px;
    overflow-x:auto;
    scrollbar-width:thin;
  }
  #tabsBar::-webkit-scrollbar{ height:6px; }
  #tabsBar::-webkit-scrollbar-thumb{ background:var(--tab-inactive); border-radius:4px; }

  .day-tab{
    flex:0 0 auto;
    font-family:var(--mono);
    font-size:12.5px;
    font-weight:600;
    letter-spacing:.01em;
    background:var(--paper-2);
    color:var(--ink-soft);
    border:1px solid var(--line);
    border-bottom:none;
    border-radius:10px 10px 0 0;
    padding:9px 14px 8px;
    margin-top:8px;
    white-space:nowrap;
    display:flex;
    align-items:center;
    gap:7px;
  }
  .day-tab .n{
    background:rgba(35,38,34,0.08);
    border-radius:999px;
    padding:0 6px;
    font-size:11px;
  }
  .day-tab.active{
    background:var(--card);
    color:var(--ink);
    margin-top:0;
    padding-top:13px;
    border-color:var(--line);
    box-shadow:0 -1px 0 var(--card) inset;
  }
  .day-tab.active .n{ background:var(--accent); color:var(--accent-ink); }

  /* ---------- Main / day view ---------- */
  main{
    flex:1;
    background:var(--card);
    border-top:1px solid var(--line);
    padding:18px 16px 100px;
  }
  #dayActions{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:16px;
  }
  #dayActions h2{
    margin:0;
    font-size:14px;
    font-weight:500;
    color:var(--ink-soft);
  }
  #dayActions h2 b{ color:var(--ink); font-weight:600; }
  #clearDayBtn{
    background:none;
    border:1px solid var(--line);
    color:var(--danger);
    font-family:var(--mono);
    font-size:12px;
    font-weight:600;
    padding:7px 11px;
    border-radius:8px;
  }
  #clearDayBtn:hover{ background:rgba(162,62,62,0.08); }

  #cardsGrid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
    gap:16px;
  }

  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
  }
  .empty-state .glyph{
    font-family:var(--mono);
    font-size:13px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--tab-inactive);
    margin-bottom:10px;
  }
  .empty-state p{ margin:0; font-size:15px; line-height:1.5; max-width:32ch; margin-inline:auto; }

  /* ---------- Flip card ---------- */
  .card{
    position:relative;
    height:150px;
    perspective:1000px;
  }
  .card-del{
    position:absolute;
    top:6px;
    right:6px;
    z-index:3;
    width:26px;
    height:26px;
    border-radius:999px;
    border:none;
    background:rgba(35,38,34,0.08);
    color:var(--ink-soft);
    font-size:15px;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .card-del:hover{ background:var(--danger); color:#fff; }

  .card-inner{
    position:relative;
    width:100%;
    height:100%;
    text-align:left;
    transition:transform .5s cubic-bezier(.4,.2,.2,1);
    transform-style:preserve-3d;
    cursor:pointer;
  }
  .card.flipped .card-inner{ transform:rotateY(180deg); }

  .card-face{
    position:absolute;
    inset:0;
    border-radius:var(--radius);
    border:1px solid var(--line);
    background:var(--card);
    box-shadow:var(--shadow);
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    padding:16px 14px 12px;
    display:flex;
    flex-direction:column;
  }
  .card-face::before{
    content:"";
    display:block;
    height:8px;
    margin:-16px -14px 10px;
    background-image:radial-gradient(circle, var(--tab-inactive) 1.6px, transparent 1.8px);
    background-size:14px 100%;
    background-position:top 4px left 7px;
    opacity:.6;
  }
  .card-face .tag{
    font-family:var(--mono);
    font-size:9.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .card-face .txt{
    font-size:14.5px;
    line-height:1.4;
    overflow:hidden;
    display:-webkit-box;
    -webkit-line-clamp:4;
    -webkit-box-orient:vertical;
  }
  .card-face .hint{
    margin-top:auto;
    font-family:var(--mono);
    font-size:10px;
    color:var(--tab-inactive);
    letter-spacing:.03em;
  }
  .card-back{
    transform:rotateY(180deg);
    background:var(--card-back);
  }
  .card-back .tag{ color:var(--accent); }

  /* ---------- FAB + add panel ---------- */
  #addFab{
    position:fixed;
    right:20px;
    bottom:20px;
    width:56px;
    height:56px;
    border-radius:16px;
    border:none;
    background:var(--accent);
    color:var(--accent-ink);
    font-size:26px;
    font-weight:600;
    box-shadow:0 10px 24px -8px rgba(47,111,94,0.55);
    z-index:20;
    transition:transform .15s ease;
  }
  #addFab:hover{ transform:translateY(-2px) rotate(90deg); }

  #addPanel{
    position:fixed;
    inset:0;
    background:rgba(35,38,34,0.45);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    z-index:30;
    padding:0;
  }
  #addPanel[hidden]{ display:none; }
  .sheet{
    background:var(--card);
    width:100%;
    max-width:460px;
    border-radius:20px 20px 0 0;
    padding:20px 20px calc(20px + env(safe-area-inset-bottom));
    box-shadow:0 -10px 30px rgba(0,0,0,0.2);
  }
  .sheet h3{
    margin:0 0 14px;
    font-family:var(--mono);
    font-size:15px;
  }
  .field{ margin-bottom:12px; }
  .field label{
    display:block;
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .field textarea{
    width:100%;
    resize:vertical;
    min-height:56px;
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    font-size:15px;
    color:var(--ink);
    background:#fff;
  }
  .sheet-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:6px;
  }
  .btn{
    font-family:var(--mono);
    font-weight:600;
    font-size:13px;
    padding:10px 16px;
    border-radius:9px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--ink);
  }
  .btn.primary{
    background:var(--accent);
    border-color:var(--accent);
    color:var(--accent-ink);
  }
  .hint-row{
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--tab-inactive);
    margin-top:2px;
  }

  /* ---------- Exam mode ---------- */
  #examOverlay{
    position:fixed;
    inset:0;
    background:var(--paper);
    z-index:40;
    display:flex;
    flex-direction:column;
  }
  #examOverlay[hidden]{ display:none; }
  .exam-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 20px;
  }
  #examExit{
    background:none;
    border:none;
    font-family:var(--mono);
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
  }
  #examExit:hover{ color:var(--ink); }
  #examProgress{
    font-family:var(--mono);
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .exam-body{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .exam-card{
    width:min(92vw, 440px);
    height:min(60vh, 320px);
    perspective:1200px;
  }
  .exam-card .card-inner{ height:100%; }
  .exam-card .card-face{ padding:26px 24px; }
  .exam-card .card-face .txt{
    font-size:19px;
    -webkit-line-clamp:8;
    flex:1;
    display:-webkit-box;
    align-items:center;
  }
  .exam-card .card-face .hint{ text-align:center; }
  .exam-nav{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:8px 20px calc(28px + env(safe-area-inset-bottom));
  }
  .nav-btn{
    font-family:var(--mono);
    font-weight:600;
    font-size:13px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:999px;
    padding:12px 20px;
    color:var(--ink);
    box-shadow:var(--shadow);
  }
  .nav-btn:disabled{ opacity:.4; cursor:default; }
  .nav-btn.primary{
    background:var(--accent);
    border-color:var(--accent);
    color:var(--accent-ink);
  }
  .exam-empty, .exam-done{
    text-align:center;
    max-width:34ch;
    color:var(--ink-soft);
  }
  .exam-empty .glyph, .exam-done .glyph{
    font-family:var(--mono);
    font-size:13px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--accent-2);
    margin-bottom:10px;
  }
  .exam-done h3{ color:var(--ink); margin:0 0 8px; font-family:var(--mono); }

  @media (max-width:520px){
    header{ padding:18px 16px 12px; }
    .brand h1{ font-size:19px; }
    #examToggle{ padding:10px 14px; font-size:12.5px; }
    .card{ height:140px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }
</style>
</head>
<body>

  <header>
    <div class="brand">
      <span class="kicker">Tu fichero personal</span>
      <h1>🗂 Flashcards</h1>
    </div>
    <button id="examToggle" type="button">
      Modo examen <span class="count" id="examCount">0</span>
    </button>
  </header>

  <nav id="tabsBar" aria-label="Días"></nav>

  <main>
    <div id="dayActions">
      <h2 id="dayTitle">—</h2>
      <button id="clearDayBtn" type="button">Vaciar este día</button>
    </div>
    <div id="cardsGrid"></div>
  </main>

  <button id="addFab" type="button" aria-label="Nueva tarjeta">+</button>

  <div id="addPanel" hidden>
    <div class="sheet">
      <h3>Nueva tarjeta</h3>
      <div class="field">
        <label for="qInput">Pregunta</label>
        <textarea id="qInput" placeholder="¿Qué quieres recordar?"></textarea>
      </div>
      <div class="field">
        <label for="aInput">Respuesta</label>
        <textarea id="aInput" placeholder="La respuesta..."></textarea>
      </div>
      <div class="hint-row">Atajo: Ctrl / Cmd + Enter para guardar</div>
      <div class="sheet-actions">
        <button class="btn" id="cancelAdd" type="button">Cancelar</button>
        <button class="btn primary" id="saveAdd" type="button">Guardar tarjeta</button>
      </div>
    </div>
  </div>

  <div id="examOverlay" hidden>
    <div class="exam-top">
      <button id="examExit" type="button">✕ Salir</button>
      <span id="examProgress"></span>
    </div>
    <div class="exam-body" id="examBody"></div>
    <div class="exam-nav" id="examNav" hidden>
      <button class="nav-btn" id="examPrev" type="button">← Anterior</button>
      <button class="nav-btn primary" id="examNext" type="button">Siguiente →</button>
    </div>
  </div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "fichero_flashcards_v1";
  var cards = loadCards();
  var activeDay = null;

  // ---------- Storage ----------
  function loadCards(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){
      console.error("No se pudieron leer las tarjetas guardadas:", e);
      return [];
    }
  }
  function saveCards(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(cards));
    }catch(e){
      console.error("No se pudieron guardar las tarjetas:", e);
      alert("No se pudo guardar la tarjeta. Puede que el almacenamiento local esté lleno o bloqueado.");
    }
  }

  function makeId(){
    if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "id-" + Date.now() + "-" + Math.random().toString(16).slice(2);
  }
  function todayKey(){
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }
  function dateKeyFromOffset(offsetDays){
    var d = new Date();
    d.setDate(d.getDate() + offsetDays);
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }
  function dayLabel(key){
    if(key === todayKey()) return "Hoy";
    if(key === dateKeyFromOffset(-1)) return "Ayer";
    var parts = key.split("-").map(Number);
    var d = new Date(parts[0], parts[1]-1, parts[2]);
    var sameYear = parts[0] === new Date().getFullYear();
    return d.toLocaleDateString("es", sameYear ? {day:"numeric", month:"short"} : {day:"numeric", month:"short", year:"numeric"});
  }

  // ---------- Derived data ----------
  function uniqueDaysDesc(){
    var seen = {};
    var days = [];
    cards.forEach(function(c){
      if(!seen[c.dateKey]){ seen[c.dateKey] = true; days.push(c.dateKey); }
    });
    days.sort(function(a,b){ return a < b ? 1 : -1; });
    return days;
  }
  function cardsForDay(key){
    return cards.filter(function(c){ return c.dateKey === key; })
                .sort(function(a,b){ return b.createdAt - a.createdAt; });
  }

  // ---------- Rendering: tabs ----------
  var tabsBar = document.getElementById("tabsBar");
  var dayTitle = document.getElementById("dayTitle");
  var cardsGrid = document.getElementById("cardsGrid");
  var examCount = document.getElementById("examCount");

  function renderTabs(){
    var days = uniqueDaysDesc();
    if(days.length === 0){
      tabsBar.innerHTML = "";
      dayTitle.innerHTML = "Tu fichero está vacío";
      cardsGrid.innerHTML = '<div class="empty-state"><div class="glyph">Sin tarjetas</div><p>Agrega tu primera tarjeta con el botón <strong>+</strong> de abajo.</p></div>';
      document.getElementById("clearDayBtn").style.visibility = "hidden";
      examCount.textContent = "0";
      return;
    }
    if(!activeDay || days.indexOf(activeDay) === -1) activeDay = days[0];

    tabsBar.innerHTML = "";
    days.forEach(function(key){
      var count = cardsForDay(key).length;
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "day-tab" + (key === activeDay ? " active" : "");
      btn.innerHTML = '<span>' + dayLabel(key) + '</span><span class="n">' + count + '</span>';
      btn.addEventListener("click", function(){
        activeDay = key;
        renderTabs();
        renderGrid();
      });
      tabsBar.appendChild(btn);
    });

    examCount.textContent = String(cards.length);
    document.getElementById("clearDayBtn").style.visibility = "visible";
  }

  // ---------- Rendering: grid ----------
  function renderGrid(){
    var list = cardsForDay(activeDay);
    dayTitle.innerHTML = 'Tarjetas de <b>' + dayLabel(activeDay) + '</b>';

    cardsGrid.innerHTML = "";
    if(list.length === 0){
      cardsGrid.innerHTML = '<div class="empty-state"><div class="glyph">Día vacío</div><p>No quedan tarjetas para este día.</p></div>';
      return;
    }
    list.forEach(function(c){
      cardsGrid.appendChild(buildCardEl(c, false));
    });
  }

  function buildCardEl(c, isExam){
    var wrap = document.createElement("div");
    wrap.className = "card" + (isExam ? " exam-card" : "");

    if(!isExam){
      var del = document.createElement("button");
      del.type = "button";
      del.className = "card-del";
      del.setAttribute("aria-label", "Eliminar tarjeta");
      del.textContent = "×";
      del.addEventListener("click", function(ev){
        ev.stopPropagation();
        deleteCard(c.id);
      });
      wrap.appendChild(del);
    }

    var inner = document.createElement("div");
    inner.className = "card-inner";
    inner.tabIndex = 0;
    inner.setAttribute("role","button");
    inner.setAttribute("aria-label","Toca para voltear la tarjeta");

    var front = document.createElement("div");
    front.className = "card-face card-front";
    front.innerHTML = '<div class="tag">Pregunta</div>';
    var frontTxt = document.createElement("div");
    frontTxt.className = "txt";
    frontTxt.textContent = c.question;
    front.appendChild(frontTxt);
    var frontHint = document.createElement("div");
    frontHint.className = "hint";
    frontHint.textContent = "toca para ver la respuesta";
    front.appendChild(frontHint);

    var back = document.createElement("div");
    back.className = "card-face card-back";
    back.innerHTML = '<div class="tag">Respuesta</div>';
    var backTxt = document.createElement("div");
    backTxt.className = "txt";
    backTxt.textContent = c.answer;
    back.appendChild(backTxt);

    inner.appendChild(front);
    inner.appendChild(back);
    wrap.appendChild(inner);

    function toggleFlip(){ wrap.classList.toggle("flipped"); }
    inner.addEventListener("click", toggleFlip);
    inner.addEventListener("keydown", function(ev){
      if(ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); toggleFlip(); }
    });

    return wrap;
  }

  function deleteCard(id){
    cards = cards.filter(function(c){ return c.id !== id; });
    saveCards();
    renderTabs();
    renderGrid();
  }

  document.getElementById("clearDayBtn").addEventListener("click", function(){
    if(!activeDay) return;
    var n = cardsForDay(activeDay).length;
    if(n === 0) return;
    var ok = confirm("¿Eliminar las " + n + " tarjeta(s) de " + dayLabel(activeDay) + "? Esta acción no se puede deshacer.");
    if(!ok) return;
    var removedKey = activeDay;
    cards = cards.filter(function(c){ return c.dateKey !== removedKey; });
    activeDay = null;
    saveCards();
    renderTabs();
    renderGrid();
  });

  // ---------- Add card ----------
  var addPanel = document.getElementById("addPanel");
  var qInput = document.getElementById("qInput");
  var aInput = document.getElementById("aInput");

  document.getElementById("addFab").addEventListener("click", function(){
    qInput.value = "";
    aInput.value = "";
    addPanel.hidden = false;
    setTimeout(function(){ qInput.focus(); }, 50);
  });
  document.getElementById("cancelAdd").addEventListener("click", function(){
    addPanel.hidden = true;
  });
  addPanel.addEventListener("click", function(ev){
    if(ev.target === addPanel) addPanel.hidden = true;
  });
  function submitCard(){
    var q = qInput.value.trim();
    var a = aInput.value.trim();
    if(!q || !a){
      alert("Escribe pregunta y respuesta antes de guardar.");
      return;
    }
    var now = Date.now();
    cards.push({ id: makeId(), question: q, answer: a, dateKey: todayKey(), createdAt: now });
    saveCards();
    activeDay = todayKey();
    addPanel.hidden = true;
    renderTabs();
    renderGrid();
  }
  document.getElementById("saveAdd").addEventListener("click", submitCard);
  [qInput, aInput].forEach(function(el){
    el.addEventListener("keydown", function(ev){
      if((ev.ctrlKey || ev.metaKey) && ev.key === "Enter"){
        ev.preventDefault();
        submitCard();
      }
    });
  });

  // ---------- Exam mode ----------
  var examOverlay = document.getElementById("examOverlay");
  var examBody = document.getElementById("examBody");
  var examNav = document.getElementById("examNav");
  var examProgress = document.getElementById("examProgress");
  var examList = [];
  var examIndex = 0;

  document.getElementById("examToggle").addEventListener("click", openExam);
  document.getElementById("examExit").addEventListener("click", closeExam);

  function openExam(){
    examList = cards.slice().sort(function(a,b){ return a.createdAt - b.createdAt; });
    examIndex = 0;
    examOverlay.hidden = false;
    document.body.style.overflow = "hidden";
    renderExam();
  }
  function closeExam(){
    examOverlay.hidden = true;
    document.body.style.overflow = "";
  }

  function renderExam(){
    examBody.innerHTML = "";
    if(examList.length === 0){
      examProgress.textContent = "";
      examNav.hidden = true;
      var empty = document.createElement("div");
      empty.className = "exam-empty";
      empty.innerHTML = '<div class="glyph">Fichero vacío</div><p>Agrega al menos una tarjeta para poder examinarte.</p>';
      examBody.appendChild(empty);
      return;
    }
    if(examIndex >= examList.length){
      examProgress.textContent = examList.length + " / " + examList.length;
      examNav.hidden = true;
      var done = document.createElement("div");
      done.className = "exam-done";
      done.innerHTML = '<div class="glyph">Fin del repaso</div><h3>Revisaste las ' + examList.length + ' tarjetas</h3>';
      var restart = document.createElement("button");
      restart.className = "nav-btn primary";
      restart.type = "button";
      restart.textContent = "Repasar de nuevo";
      restart.style.marginTop = "14px";
      restart.addEventListener("click", function(){ examIndex = 0; renderExam(); });
      done.appendChild(document.createElement("br"));
      done.appendChild(restart);
      examBody.appendChild(done);
      return;
    }

    examNav.hidden = false;
    examProgress.textContent = (examIndex+1) + " / " + examList.length;
    var el = buildCardEl(examList[examIndex], true);
    examBody.appendChild(el);

    document.getElementById("examPrev").disabled = examIndex === 0;
    document.getElementById("examNext").textContent = (examIndex === examList.length - 1) ? "Terminar" : "Siguiente →";
  }

  document.getElementById("examPrev").addEventListener("click", function(){
    if(examIndex > 0){ examIndex--; renderExam(); }
  });
  document.getElementById("examNext").addEventListener("click", function(){
    examIndex++; renderExam();
  });

  document.addEventListener("keydown", function(ev){
    if(examOverlay.hidden) return;
    if(ev.key === "Escape") closeExam();
    else if(ev.key === "ArrowRight") document.getElementById("examNext").click();
    else if(ev.key === "ArrowLeft") document.getElementById("examPrev").click();
    else if(ev.key === " " || ev.key === "Enter"){
      var card = examBody.querySelector(".card");
      if(card){ ev.preventDefault(); card.classList.toggle("flipped"); }
    }
  });

  // ---------- Init ----------
  renderTabs();
  renderGrid();
})();
</script>

</body>
</html>
